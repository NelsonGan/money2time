name = "money2time-workers-web-dashboard"
main = "src/index.ts"
compatibility_date = "2026-10-15"

# Custom domain — the money2time.com zone must be on this Cloudflare account.
routes = [
  { pattern = "workers-web-dashboard.money2time.com", custom_domain = true }
]

# Production only, on the custom domain. Preview URLs are off: Cloudflare does
# not make them for Workers with Durable Objects, and nothing uses them.
workers_dev = false
preview_urls = false

# One relay room per link. Rooms store nothing: they forward each message
# between the phone and the browser and keep no copy (see src/room.ts).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Connections per address (IPv6: per /64) per minute. A phone with all eight
# links reconnecting with backoff stays below it.
[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "2401"

  [ratelimits.simple]
  limit = 120
  period = 60

# Errors and console output only: invocation logs would record every
# connection's address, which this relay has no need to keep.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[vars]
# Browser origins allowed to open a browser seat in a room.
ALLOWED_ORIGINS = "https://app.money2time.com"

# No secrets: the relay holds no keys and no data.
