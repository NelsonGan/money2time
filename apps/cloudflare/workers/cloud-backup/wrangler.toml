name = "money2time-workers-cloud-backup"
main = "src/index.ts"
compatibility_date = "2026-10-15"

# Custom domain — the money2time.com zone must be on this Cloudflare account.
routes = [
  { pattern = "workers-cloud-backup.money2time.com", custom_domain = true }
]

# Same rationale as the other Workers: production only on the custom domain,
# versioned preview URLs kept for branch builds.
workers_dev = false
preview_urls = true

# Vaults, devices, linked browsers and backup metadata — no accounts and
# nothing personal (schema: apps/cloudflare/d1/cloud-backup/schema.sql).
[[d1_databases]]
binding = "MONEY2TIME_D1_CLOUD_BACKUP"
database_name = "money2time-d1-cloud-backup"
database_id = "c8edd581-ec47-449d-b732-44096673f864"

# The backups themselves, end-to-end encrypted on the phone before upload.
# Private: no public access and no r2.dev URL; every read and write goes
# through a short-lived URL this Worker signs after checking the vault.
[[r2_buckets]]
binding = "MONEY2TIME_R2_CLOUD_BACKUP"
bucket_name = "money2time-r2-cloud-backup"

# Daily cleanup (D1 has no TTL): expired QR links, rate-limit windows, and
# vaults nobody has opened in 180 days.
[triggers]
crons = ["30 3 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
PUBLIC_URL = "https://workers-cloud-backup.money2time.com"
# Browser origins allowed to call the API.
ALLOWED_ORIGINS = "https://app.money2time.com"
# RevenueCat entitlement that counts as Pro (same as the receipt scanner).
ENTITLEMENT_ID = "pro"
# Largest compressed backup accepted, in bytes. The Worker holds an upload in
# memory to check its size and checksum, so this stays well under the 128 MB
# isolate limit; a five-year database with photos gzips to about 9 MB.
MAX_BACKUP_BYTES = "67108864"

# Secrets — add in the Cloudflare dashboard (Workers & Pages → this Worker →
# Settings → Variables and Secrets → add as "Secret"), never commit:
#   URL_SIGNING_SECRET    32+ random bytes; signs the short-lived upload/download URLs
#   REVENUECAT_SECRET_KEY RevenueCat v1 secret API key (Pro checks); unset = nobody is Pro
