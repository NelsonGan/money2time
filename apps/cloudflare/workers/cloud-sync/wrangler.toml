name = "money2time-workers-cloud-sync"
main = "src/index.ts"
compatibility_date = "2026-10-15"
# Better Auth uses node:crypto and AsyncLocalStorage.
compatibility_flags = ["nodejs_compat"]

# Custom domain — the money2time.com zone must be on this Cloudflare account.
routes = [
  { pattern = "workers-cloud-sync.money2time.com", custom_domain = true }
]
workers_dev = false
preview_urls = false

[observability]
enabled = true

# Better Auth tables, per-user Turso database records, Pro links.
# Schema: apps/cloudflare/d1/cloud-sync/schema.sql
[[d1_databases]]
binding = "AUTH_DB"
database_name = "money2time-cloud-sync-auth"
database_id = "2154e310-6fce-49eb-aa4b-565e343c9eb7"

# The user's images. Private: only this Worker reads or writes it.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "money2time-cloud-sync-media"

# Sign-in codes. The sender domain must be onboarded to Email Service.
[[send_email]]
name = "EMAIL"
remote = true

# POSTs to /api/auth per client IP per minute, on top of Better Auth's own limits.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "2402"
simple = { limit = 30, period = 60 }

# Sign-in codes per recipient address per minute, whatever the IP.
[[ratelimits]]
name = "OTP_LIMITER"
namespace_id = "2403"
simple = { limit = 3, period = 60 }

# Daily: clear expired sign-in codes and old rate-limit rows.
[triggers]
crons = ["17 3 * * *"]

[vars]
BETTER_AUTH_URL = "https://workers-cloud-sync.money2time.com"
# Google Sign-In ID-token audiences: the iOS client (iOS tokens) and the web
# client (Android tokens, which are issued for the webClientId).
GOOGLE_CLIENT_IDS = "229377044166-7hkgkf8se5duonne5tgbph71ld6to3pg.apps.googleusercontent.com,229377044166-862vte0l859hsifla83k0q1rhjtcs9h0.apps.googleusercontent.com"
APPLE_CLIENT_IDS = "com.nelsongan.money2time"
APPLE_APP_BUNDLE_IDENTIFIER = "com.nelsongan.money2time"
# Sign in with Apple key "Money2Time Cloud Sync" (token revocation on account
# deletion). Its .p8 is the secret APPLE_PRIVATE_KEY.
APPLE_TEAM_ID = "A9QF26PBRS"
APPLE_KEY_ID = "F5629ZF4G6"
EMAIL_FROM = "hello@money2time.com"
REVENUECAT_ENTITLEMENT_ID = "pro"
# Public SDK keys (they ship inside the app). A secret REVENUECAT_SECRET_KEY,
# when set, is used instead.
REVENUECAT_PUBLIC_KEYS = "appl_ELByGHLlPQeZQeixSyXhATAqnGJ,goog_QiZPmlHUwoGpYQUqjtYMNjcnWsu"
TURSO_ORG = "nelsongan"
TURSO_GROUP = "m2t-sync"

# Secrets (wrangler secret put):
#   BETTER_AUTH_SECRET     random 32+ bytes
#   TURSO_API_TOKEN        Turso Platform API token for the organization above
#   APPLE_PRIVATE_KEY      the Sign in with Apple key's .p8 contents
#   REVENUECAT_SECRET_KEY  optional, sk_… (otherwise the public keys above)
