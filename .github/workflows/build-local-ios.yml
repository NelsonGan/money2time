name: Build Local (iOS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        default: production
        options:
          - production
          - preview
          - development

jobs:
  build:
    name: Build iOS Locally (${{ inputs.profile }})
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow can only be run on main (got ${{ github.ref }})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache eas-build-local
        uses: actions/cache@v4
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-eas-build-local-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install dependencies
        run: npm ci

      - name: Build iOS (local)
        run: |
          mkdir -p build
          eas build --platform ios --profile ${{ inputs.profile }} --local --non-interactive --output=./build/money2time-ios-${{ inputs.profile }}.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: money2time-ios-${{ inputs.profile }}-${{ github.run_number }}
          path: ./build/money2time-ios-${{ inputs.profile }}.ipa
          retention-days: 14
