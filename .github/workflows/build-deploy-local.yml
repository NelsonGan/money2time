name: Build & Deploy (Local Runner)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build & deploy
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
      profile:
        description: EAS build profile
        type: choice
        default: production
        options:
          - production
          - preview
          - development

jobs:
  build-deploy:
    name: Build & Deploy ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow can only be run on main (got ${{ github.ref }})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        if: inputs.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache eas-build-local
        uses: actions/cache@v4
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-eas-build-local-

      - name: Cache CocoaPods
        if: inputs.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache Gradle
        if: inputs.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Resolve output path
        id: out
        shell: bash
        run: |
          if [ "${{ inputs.platform }}" = "ios" ]; then
            ext=ipa
          elif [ "${{ inputs.profile }}" = "production" ]; then
            ext=aab
          else
            ext=apk
          fi
          echo "file=./build/money2time-${{ inputs.platform }}-${{ inputs.profile }}.$ext" >> "$GITHUB_OUTPUT"

      - name: Build (local)
        run: |
          mkdir -p build
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --local \
            --non-interactive \
            --output=${{ steps.out.outputs.file }}

      - name: Submit to store
        run: |
          eas submit \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --path ${{ steps.out.outputs.file }} \
            --non-interactive
