name: App Studio

# Checks the App Studio in apps/app-studio (the store screenshots, creatives
# and listing copy) on every pull request and push to `main` that touches it.
# It deploys nothing: uploads to the stores run by hand from a Mac that holds
# the store CLIs' credentials. README: *App Studio*.
run-name: >-
  ${{ github.event_name == 'pull_request' && format('App Studio · PR #{0}', github.event.number)
   || format('App Studio · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    paths:
      - 'apps/app-studio/**'
      - '.github/workflows/app-studio.yml'
  pull_request:
    paths:
      - 'apps/app-studio/**'
      - '.github/workflows/app-studio.yml'
  workflow_dispatch:

concurrency:
  group: app-studio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: App Studio · Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/app-studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: apps/app-studio

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/app-studio/package-lock.json

      # The Search creative tests encode and decode real video.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
