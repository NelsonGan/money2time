name: Cloudflare

# Self-contained CI for the Cloudflare resources under cloudflare/ (the
# receipt-scan Worker and its D1 database schema). Only runs when those files
# change, so it never fires on app-only commits. Future Workers or D1 databases
# under cloudflare/ can be added as their own jobs/matrix here.
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Cloudflare · PR #{0}', github.event.number)
   || github.ref == 'refs/heads/main' && 'Cloudflare · Production deploy'
   || format('Cloudflare · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Cloudflare · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # wrangler v4 requires Node >= 22.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck Worker
        working-directory: cloudflare/workers/receipt-scanner
        run: |
          npm ci
          npm run typecheck

  deploy:
    name: Cloudflare · Deploy (production)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare/workers/receipt-scanner
        run: npm ci

      # schema.sql is idempotent (CREATE TABLE/INDEX IF NOT EXISTS), so re-applying
      # it on every deploy is safe and keeps the D1 schema in sync with the code —
      # future additive schema changes ship automatically on merge to main. The
      # CLOUDFLARE_API_TOKEN must include D1 edit permission for this step.
      - name: Apply D1 schema
        working-directory: cloudflare/workers/receipt-scanner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute money2time-d1-receipt-scanner --remote --file=../../d1/receipt-scanner/schema.sql

      - name: Deploy Worker to production
        working-directory: cloudflare/workers/receipt-scanner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Deploy to 100% production traffic + provision the custom-domain route
          # (workers-receipt-scanner.money2time.com) and apply the [observability] config.
          npx wrangler deploy --tsconfig tsconfig.json
