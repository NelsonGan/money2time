name: Cloudflare

# Self-contained CI for the Cloudflare resources under apps/cloudflare/ (each Worker
# and its D1 database schema). Only runs when those files change, so it never
# fires on app-only commits. Both jobs run over the same matrix, so adding a
# Worker is one entry: its directory name under apps/cloudflare/workers/ plus the D1
# database its schema belongs to (none for a Worker without one).
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Cloudflare · PR #{0}', github.event.number)
   || github.ref == 'refs/heads/main' && 'Cloudflare · Production deploy'
   || format('Cloudflare · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    paths:
      # Documentation under apps/cloudflare/ can't change what the Worker does, so
      # it is excluded (later patterns win) and never triggers a deploy.
      - 'apps/cloudflare/**'
      - '!apps/cloudflare/**/*.md'
      - '.github/workflows/cloudflare.yml'
  pull_request:
    paths:
      - 'apps/cloudflare/**'
      - '!apps/cloudflare/**/*.md'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

# A newer PR push replaces an older check, but a production deploy always runs
# to the end: cancelling one between the schema step and `wrangler deploy`
# would leave the schema ahead of the code.
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Cloudflare · Typecheck (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: receipt-scanner
            database: money2time-d1-receipt-scanner
          - worker: live-earnings
            database: money2time-d1-live-earnings
          - worker: web-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # wrangler v4 requires Node >= 22.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The dry run bundles the Worker and validates wrangler.toml (bindings,
      # migrations, compatibility date) without touching Cloudflare.
      - name: Typecheck and bundle Worker
        working-directory: apps/cloudflare/workers/${{ matrix.worker }}
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run --outdir dist --tsconfig tsconfig.json

  deploy:
    name: Cloudflare · Deploy ${{ matrix.worker }} (production)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One Worker failing to deploy must not strand the others half-shipped.
      fail-fast: false
      matrix:
        include:
          - worker: receipt-scanner
            database: money2time-d1-receipt-scanner
            schema: receipt-scanner
          - worker: live-earnings
            database: money2time-d1-live-earnings
            schema: live-earnings
          # Stateless: no D1 database, so no schema to apply.
          - worker: web-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Deploy only the Workers this push changed. A new version restarts the
      # Worker's Durable Objects, which drops every live Web Dashboard
      # connection, so a receipt-scanner change must not redeploy the relay.
      - name: Check whether this Worker changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          WORKER: ${{ matrix.worker }}
          SCHEMA: ${{ matrix.schema }}
        run: |
          paths=("apps/cloudflare/workers/$WORKER" .github/workflows/cloudflare.yml)
          [ -n "$SCHEMA" ] && paths+=("apps/cloudflare/d1/$SCHEMA")
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- "${paths[@]}" ':!*.md'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No changes to $WORKER; skipping its deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.changes.outputs.deploy == 'true'
        working-directory: apps/cloudflare/workers/${{ matrix.worker }}
        run: npm ci

      # schema.sql is idempotent (CREATE TABLE/INDEX IF NOT EXISTS), so re-applying
      # it on every deploy is safe and keeps the D1 schema in sync with the code —
      # future additive schema changes ship automatically on merge to main. The
      # CLOUDFLARE_API_TOKEN must include D1 edit permission for this step.
      - name: Apply D1 schema
        if: matrix.database && steps.changes.outputs.deploy == 'true'
        working-directory: apps/cloudflare/workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute ${{ matrix.database }} --remote --file=../../d1/${{ matrix.schema }}/schema.sql

      - name: Deploy Worker to production
        if: steps.changes.outputs.deploy == 'true'
        working-directory: apps/cloudflare/workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Deploy to 100% production traffic + provision the Worker's
          # custom-domain route and apply its [observability] config.
          npx wrangler deploy --tsconfig tsconfig.json
