name: Build & Deploy (Expo Cloud)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build & deploy
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
      profile:
        description: EAS build profile
        type: choice
        default: production
        options:
          - production
          - preview
          - development

jobs:
  build-deploy:
    name: Build & Deploy ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow can only be run on main (got ${{ github.ref }})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build & Submit (cloud)
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --auto-submit
