name: Web

# The website and Web Dashboard in apps/web: checks and builds every pull
# request that touches it, uploads the build as a Worker version without
# deploying it, and deploys `main` to the money2time-workers-web Worker.
# README: *Website*.
#
# The checkout is shallow and holds only apps/web (and .github/, for the
# action that sets up dependencies): the repository's history is mostly old
# screenshots, and the mobile app's artwork is hundreds of MB.
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Web · PR #{0}', github.event.number)
   || github.ref == 'refs/heads/main' && 'Web · Production deploy'
   || format('Web · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

# A newer push to a pull request replaces its older run. Production deploys
# queue rather than cancel, so each merge is deployed in order.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Web · Check, build and deploy' || 'Web · Check, build and upload' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    # CLOUDFLARE_WEB_API_TOKEN is the account API token
    # money2time-web-github-actions: Workers Scripts, the zone's routes, DNS and
    # certificates (for the custom domains), and read-only R2 for the media
    # check. Only the steps that call Cloudflare get it, so `npm ci`'s install
    # scripts, lint, tests and the build never see it. Pull requests from forks
    # get no secrets, so they skip those steps.
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            apps/web

      - name: Set up dependencies
        uses: ./.github/actions/node-deps
        with:
          directory: apps/web
          node-version: 24

      - name: Test
        run: npm test

      - name: Check every locale against en.json
        run: node scripts/validate-messages.mjs

      # A production deploy needs the token; a pull request without it (a fork,
      # or before the secret is set) still gets every check and the build.
      - name: Check the Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "::error::The CLOUDFLARE_WEB_API_TOKEN secret is not set, so main cannot deploy."
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_WEB_API_TOKEN: skipping the media check and the Worker upload."
          fi

      # A deploy does not upload media, so a page must not ship before the
      # pictures it shows are in the bucket.
      - name: Check media/ is published to R2
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_API_TOKEN }}
        run: node scripts/upload-media.mjs --check

      # Lint runs while the build does, not before it: neither reads what the
      # other writes (eslint.config.mjs ignores every build output), and the
      # build is the longer of the two. Lint's output is printed once the build
      # has finished, so the two never interleave. The typecheck stays a step
      # of its own because it does read what the build writes.
      - name: Lint and build
        run: |
          npm run --silent lint > "$RUNNER_TEMP/lint.log" 2>&1 &
          lint=$!
          build=0
          npm run build || build=$?
          if wait "$lint"; then
            echo "::group::Lint passed"
            cat "$RUNNER_TEMP/lint.log"
            echo "::endgroup::"
          else
            echo "──── Lint FAILED ────"
            cat "$RUNNER_TEMP/lint.log"
            echo "::error::Lint failed. Run \`npm run lint\` in apps/web to reproduce."
            exit 1
          fi
          exit "$build"

      # After the build: vinext writes the route types (`PageProps`) to
      # `.next/types` and `next-env.d.ts` as it builds, and neither is committed.
      - name: Typecheck
        run: npm run typecheck

      # Pull requests and other branches: upload the build as a version without
      # sending it any traffic. This proves the Worker uploads and binds.
      - name: Upload Worker version
        if: github.ref != 'refs/heads/main' && steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_API_TOKEN }}
        run: npm run upload

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_API_TOKEN }}
        run: npm run deploy:prebuilt
