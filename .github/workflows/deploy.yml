name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
      profile:
        description: EAS profile
        type: choice
        default: production
        options:
          - production
          - preview
          - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test

  preview-pending:
    name: Preview Pending
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Flag preview comment as pending
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- eas-update-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            // Keep the previously published QR/link in place and only flip the
            // status row, so the user can still scan the old build meanwhile but
            // knows it isn't the latest commit yet.
            const pendingStatus = `| **Status** | ⏳ Building \`${commit}\`… — the QR below is still the previous build |`;
            const statusRe = /\| \*\*Status\*\* \|[^\n]*\|/;
            if (existing && statusRe.test(existing.body)) {
              const body = existing.body.replace(statusRe, pendingStatus);
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              // No preview published yet — post a lightweight placeholder.
              const body = [
                marker,
                '## 📱 Preview this update',
                '',
                `⏳ **Building the first preview** for commit \`${commit}\`… This comment updates automatically with a QR code and link the moment it is ready.`,
              ].join('\n');
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

  preview-cleanup:
    name: Preview Cleanup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Delete preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- eas-update-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            for (const c of comments) {
              if (c.body && c.body.includes(marker)) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
              }
            }

  pr-update:
    name: PR Update
    needs: test
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish PR update
        id: preview
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --branch pr-${{ github.event.number }} --message "${{ github.event.pull_request.title }}"
          comment: false

      - name: Comment QR code and link
        uses: actions/github-script@v7
        with:
          script: |
            const link = `${{ steps.preview.outputs.link }}`;
            const qr = `${{ steps.preview.outputs.qr }}`;
            const branch = `${{ steps.preview.outputs.branchName }}`;
            const runtime = `${{ steps.preview.outputs.runtimeVersion }}`;
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            // This step runs right after the update is published, so "now" is
            // effectively when the EAS update finished.
            const publishedAt = new Date().toLocaleString('en-US', {
              timeZone: 'Asia/Singapore',
              dateStyle: 'medium',
              timeStyle: 'short',
            }) + ' GMT+8';
            const marker = '<!-- eas-update-preview -->';
            const body = [
              marker,
              '## 📱 Preview this update',
              '',
              'Your changes are published to a preview branch — open them on your device in one tap.',
              '',
              '<table>',
              '<tr>',
              `<td width="260" align="center"><a href="${link}"><img src="${qr}" width="220" alt="EAS Update QR code" /></a><br/><sub>Scan or tap to open with your dev build</sub></td>`,
              '<td valign="middle">',
              '',
              '| | |',
              '| --- | --- |',
              '| **Status** | ✅ Up to date |',
              `| **Branch** | \`${branch}\` |`,
              `| **Runtime** | \`${runtime}\` |`,
              `| **Commit** | \`${commit}\` |`,
              `| **Published** | ${publishedAt} |`,
              '',
              '</td>',
              '</tr>',
              '</table>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  plan:
    name: Plan
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'development')
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Resolve build matrix
        id: matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'include=[{"platform":"ios","label":"iOS","os":"macos-15","profile":"production"},{"platform":"android","label":"Android","os":"ubuntu-latest","profile":"production"}]' >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.platform }}" = "ios" ]; then
              os="macos-15"
              label="iOS"
            else
              os="ubuntu-latest"
              label="Android"
            fi
            echo "include=[{\"platform\":\"${{ inputs.platform }}\",\"label\":\"$label\",\"os\":\"$os\",\"profile\":\"${{ inputs.profile }}\"}]" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy ${{ matrix.label }} (${{ matrix.profile }})
    needs: plan
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'development')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Verify branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploy can only run on main (got ${{ github.ref }})."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache eas-build-local
        uses: actions/cache@v4
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-eas-build-local-

      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Resolve output path
        id: output
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            ext=ipa
          elif [ "${{ matrix.profile }}" = "production" ]; then
            ext=aab
          else
            ext=apk
          fi
          echo "file=./build/money2time-${{ matrix.platform }}-${{ matrix.profile }}.$ext" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          mkdir -p build
          eas build \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --local \
            --non-interactive \
            --output=${{ steps.output.outputs.file }}

      - name: Submit build
        run: |
          eas submit \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --path ${{ steps.output.outputs.file }} \
            --non-interactive

  dev-build:
    name: Dev Build (${{ github.event.inputs.platform }})
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start cloud dev-client build
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform }} \
            --profile development \
            --non-interactive \
            --no-wait
