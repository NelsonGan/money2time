name: CI / CD

# Path-aware pipeline. The `changes` job classifies the diff once and every
# downstream job keys off it, so a change only pays for the pipeline it can
# actually affect: a Worker-, website-, App Studio- or docs-only merge to main
# never kicks off an iOS + Android store build, a website- or App Studio-only
# PR skips the app's jobs, and a docs- or Worker-only one skips the bundle. The
# Workers, the website and App Studio have their own path-filtered workflows
# (cloudflare.yml, web.yml, app-studio.yml). Skipped jobs still report as
# successful to branch protection, which is why this gates jobs with `if:`
# instead of workflow-level `paths:` (a workflow skipped by a path filter
# leaves required checks pending forever).
#
# `checks`, `lint` and `bundle` run side by side on their own runners, all
# from the node_modules cache in .github/actions/node-deps, and `test` is the
# one check that says all three passed. README: *CI and deploy*.

# Give each run a clear title in the Actions list so production, PR, manual,
# and branch runs are easy to tell apart at a glance.
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR · #{0}', github.event.number)
   || github.event_name == 'workflow_dispatch' && format('Manual · {0}/{1}', github.event.inputs.platform, github.event.inputs.profile)
   || github.ref == 'refs/heads/main' && 'Production Release'
   || format('Branch · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
      profile:
        description: EAS profile
        type: choice
        default: production
        options:
          - production
          - preview
          - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the diff into the three flags the jobs below gate on:
  #   app     — anything that can reach the mobile binary (gates the
  #             production store build)
  #   checks  — anything the app's `npm run check` / `npm test` can see (the
  #             `checks` and `lint` jobs), i.e. everything outside apps/web/
  #             and apps/app-studio/. prettier only sees apps/mobile, the
  #             root docs and .github/, but jest, the typecheck and eslint's
  #             import rules also read the Workers: __tests__/cloudflare/ and
  #             the live-earnings contract tests import
  #             apps/cloudflare/workers/*/src, so a Worker change runs these
  #             jobs too. The website and App Studio have their own workflows
  #             (web.yml, app-studio.yml).
  #   bundle  — anything Metro can bundle differently: `app`, plus this
  #             workflow and the actions it uses (a change to the bundle job
  #             should run it). A docs- or Worker-only change skips the job.
  # Fail open: when the diff can't be resolved, every flag is true.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app: ${{ steps.classify.outputs.app }}
      checks: ${{ steps.classify.outputs.checks }}
      bundle: ${{ steps.classify.outputs.bundle }}
    steps:
      # Every other job waits for this one, so it fetches as little as it can:
      # the diff below compares two trees and never reads a file, so the
      # commits come without their blobs (the app's artwork and the store
      # screenshots are hundreds of MB) and only .github/ is written to disk.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Depth 2 so the diff below has a parent commit to compare against.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github

      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail

          # --no-renames in every diff below: a file moved out of the app shows
          # up as a deletion there and an addition elsewhere, so the move still
          # counts as an app change. With rename detection it would be listed
          # under its new path only, and detecting renames reads file contents,
          # which this blobless checkout would have to download.
          files=""
          resolved=false
          if [ "$EVENT" = "pull_request" ]; then
            # PR runs check out the merge commit; parent 1 is the base branch,
            # so this diff is exactly the PR's changes.
            if files=$(git diff --name-only --no-renames HEAD^1 HEAD 2>/dev/null); then
              resolved=true
            fi
          elif [ "$EVENT" = "push" ]; then
            # Prefer the push's own before..after range (covers a multi-commit
            # push); fall back to the last commit's parent, which is what a
            # squash-merge to main looks like anyway.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git fetch --depth=1 origin "$BEFORE" 2>/dev/null \
              && files=$(git diff --name-only --no-renames "$BEFORE" HEAD 2>/dev/null); then
              resolved=true
            elif files=$(git diff --name-only --no-renames HEAD^1 HEAD 2>/dev/null); then
              resolved=true
            fi
          fi

          if [ "$resolved" != true ]; then
            # workflow_dispatch, or a diff we couldn't resolve: build everything.
            echo "Changed paths not resolvable for '$EVENT' — treating all as changed."
            printf 'app=true\nchecks=true\nbundle=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$files" | sed '/^$/d' > changed.txt
          echo "Changed files:"
          sed 's/^/  /' changed.txt

          app=false
          checks=false
          bundle=false
          # These classifications write each grep's matches to a file and test
          # that file, rather than piping one grep into a `grep -q` that exits on
          # the first match. Under `pipefail` that pipe is a silent landmine: the
          # reader exits early, the writer takes SIGPIPE (141) once the diff is
          # big enough to still be writing, and pipefail hands that 141 to the
          # `if`, so a genuine app change classifies as `app=false` and the push
          # never cuts a store build. It is size-dependent, so it passed on every
          # normal diff and first bit on a 2,265-file one. Keep these unpiped.
          grep -qvE '^apps/(web|app-studio)/' changed.txt && checks=true
          # Paths that cannot change the shipped binary. Anything else counts as
          # an app change, so an unrecognised path always builds the app.
          grep -vE '^(apps/cloudflare/|apps/web/|apps/app-studio/|\.github/|\.claude/|\.agents/|\.codex/|\.vscode/)|(^|/)[^/]*\.md$|^LICENSE$' changed.txt > app_paths.txt || true
          [ -s app_paths.txt ] && app=true
          # The bundle job also runs for a change to the job itself.
          if [ "$app" = true ] || grep -qE '^\.github/(workflows/deploy\.yml|actions/)' changed.txt; then bundle=true; fi

          echo "app=$app | checks=$checks | bundle=$bundle"
          printf 'app=%s\nchecks=%s\nbundle=%s\n' "$app" "$checks" "$bundle" >> "$GITHUB_OUTPUT"

  # `npm run check` (typecheck, lint, format) and `npm test`, split over two
  # runners because lint alone takes as long as the other three together.
  # Running the three checks side by side on one runner was tried first and
  # saved almost nothing: they compete for the same cores, and finished in
  # 102 seconds where one after another they take about 115.
  #
  # Both jobs run inside apps/mobile. They also read the Workers (jest, the
  # typecheck and ESLint's import rules follow the tests' imports into
  # apps/cloudflare/workers/*/src), but never apps/web/ or apps/app-studio/,
  # so a change confined to those two has nothing to run here.
  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # Only what the checks read: the app, the Workers its tests import, and
      # .github/ plus the root files (README.md and the other docs prettier
      # and the analytics test read, which a sparse checkout always includes).
      # A test that starts reading another app fails here with a missing file:
      # add that directory to the list.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            apps/cloudflare
            apps/mobile

      - name: Set up dependencies
        uses: ./.github/actions/node-deps
        with:
          directory: apps/mobile
          node-version: 22

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # The same files as `checks`: ESLint lints only the app, but its
      # import/no-unresolved rule follows the tests' imports into the Workers
      # and reports each one it cannot find.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            apps/cloudflare
            apps/mobile

      # `checks` saves the node_modules cache; this job only reads it.
      - name: Set up dependencies
        uses: ./.github/actions/node-deps
        with:
          directory: apps/mobile
          node-version: 22
          save: false

      # `checks` and this job together are `npm run check`, taken apart. If
      # package.json's `check` or `lint` script changes, this fails until the
      # two jobs are brought in line, instead of CI quietly checking less than
      # `npm run check` does.
      - name: Check that these jobs still match `npm run check`
        run: |
          expect() {
            actual=$(node -p "require('./package.json').scripts['$1']")
            if [ "$actual" != "$2" ]; then
              echo "::error::package.json's \"$1\" script is now '$actual'. Bring the checks and lint jobs in .github/workflows/deploy.yml in line with it, then update this guard."
              exit 1
            fi
          }
          expect check 'npm run typecheck && npm run lint && npm run format:check'
          expect lint 'expo lint .'

      # ESLint directly, not `npm run lint`: `expo lint` passes on ESLint's
      # exit status, which is empty when ESLint is killed (out of memory,
      # say), so a lint that died would be reported as passed. It also writes
      # an ESLint cache, which a CI run never reuses. Two threads, because
      # this job has the runner to itself.
      - name: Lint
        run: npx eslint . --concurrency 2

  # Typecheck and jest never run Metro, so without this a PR that breaks the
  # bundle (an import or asset only Metro resolves) would first fail in the
  # store build after merge. It runs beside `checks` and `lint`, one runner
  # per platform: bundling both on one runner took almost twice as long.
  #
  # On a push to main it only keeps the Metro cache warm for the pull requests
  # that branch from main (a pull request can read a cache saved by its own
  # earlier runs or by main, never by another pull request): when the cache
  # for this key already exists the job stops after looking it up, and when it
  # does not, the job bundles and saves it. The store build does not wait for
  # it either way; it bundles again itself.
  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.bundle == 'true'
    strategy:
      # Each platform reports on its own: one failing does not cancel the other.
      fail-fast: false
      matrix:
        platform: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # Metro only bundles the app (metro.config.js blocks the other apps).
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            apps/mobile

      # Metro keeps each file's transformed output in $TMPDIR/metro-cache,
      # keyed by the file's contents and by its own configuration (the Babel
      # config and every transform option), so a restored cache only skips
      # files whose result would be the same. Resolving imports and assets, the
      # thing this job is here to check, is never cached. With the cache the
      # bundle takes about half the time. Each platform has its own cache: a
      # file is transformed once per platform.
      #
      # The key adds what changes a transform without Metro noticing: the
      # dependencies and their patches, the Babel plugin and Metro stubs in
      # scripts/, and the Babel, Metro and Tailwind config. A change to any of
      # them starts a new cache; otherwise it is saved once and reused as it
      # is, so it is not uploaded again on every run. The files changed since
      # it was saved are transformed again each run, which takes seconds. A
      # push only looks the cache up (see above), it does not download it.
      - name: Restore Metro cache
        id: metro
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/patches/**', 'apps/mobile/babel.config.js', 'apps/mobile/metro.config.js', 'apps/mobile/tailwind.config.js', 'apps/mobile/global.css', 'apps/mobile/scripts/babel/**', 'apps/mobile/scripts/metro/**') }}
          lookup-only: ${{ github.event_name == 'push' }}

      # `checks` saves the node_modules cache; this job only reads it.
      - name: Set up dependencies
        if: github.event_name == 'pull_request' || steps.metro.outputs.cache-hit != 'true'
        uses: ./.github/actions/node-deps
        with:
          directory: apps/mobile
          node-version: 22
          save: false

      - name: Bundle app
        if: github.event_name == 'pull_request' || steps.metro.outputs.cache-hit != 'true'
        env:
          # Where Metro puts metro-cache/ (os.tmpdir()), so the step above
          # caches a path this workflow chose.
          TMPDIR: ${{ runner.temp }}
        run: npx expo export --platform ${{ matrix.platform }} --output-dir "$RUNNER_TEMP/expo-export"

  # The one check to read on a pull request: green means `checks`, `lint` and
  # both `bundle` jobs passed (or `bundle` had nothing to do). They are separate jobs
  # so they can run at the same time, and without this a pull request with one
  # of them red would look green on the others. Nothing waits for this job: the
  # store build is gated on `checks` and `lint`, as it was when the bundle was
  # a pull-request-only step.
  test:
    name: Test
    needs: [changes, checks, lint, bundle]
    # Runs when the jobs it reports on failed, too; that is its purpose.
    if: ${{ !cancelled() && needs.changes.outputs.checks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that the checks, lint and the bundle passed
        env:
          CHECKS: ${{ needs.checks.result }}
          LINT: ${{ needs.lint.result }}
          BUNDLE: ${{ needs.bundle.result }}
        run: |
          echo "checks: $CHECKS"
          echo "lint: $LINT"
          echo "bundle: $BUNDLE"
          if [ "$CHECKS" != success ]; then
            echo "::error::The Checks job did not pass ($CHECKS)."
            exit 1
          fi
          if [ "$LINT" != success ]; then
            echo "::error::The Lint job did not pass ($LINT)."
            exit 1
          fi
          if [ "$BUNDLE" != success ] && [ "$BUNDLE" != skipped ]; then
            echo "::error::The Bundle job did not pass ($BUNDLE)."
            exit 1
          fi

  # Production Worker deploys live in the dedicated cloudflare.yml workflow (runs on
  # push to main when apps/cloudflare/** changes), so there is no worker-deploy job here —
  # that would double-deploy the Worker on every push to main.

  plan:
    name: Production · Plan
    # Waits for `checks` and `lint`, not for the `test` job that sums them up
    # with `bundle`: a job whose own `if:` has no status check is skipped when
    # any job upstream of it was skipped, and `bundle` is skipped on a manual
    # run.
    needs: [changes, checks, lint]
    # A push to main only cuts a store build when something in the push can
    # reach the binary — a Worker-only or docs-only merge stops here. Manual
    # dispatch always builds (that is what it is for).
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.app == 'true')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'development')
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Resolve build matrix
        id: matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'include=[{"platform":"ios","label":"iOS","os":"xcode-27","profile":"production"},{"platform":"android","label":"Android","os":"ubuntu-latest","profile":"production"}]' >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.platform }}" = "ios" ]; then
              os="xcode-27"
              label="iOS"
            else
              os="ubuntu-latest"
              label="Android"
            fi
            echo "include=[{\"platform\":\"${{ inputs.platform }}\",\"label\":\"$label\",\"os\":\"$os\",\"profile\":\"${{ inputs.profile }}\"}]" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Production · App (${{ matrix.label }} · ${{ matrix.profile }})
    needs: plan
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'development')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Verify branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploy can only run on main (got ${{ github.ref }})."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      # The Android build fills ubuntu-latest's disk: a ~5 GB Gradle cache, the
      # NDK (downloaded on every build), node_modules and EAS's working copy of
      # the project. A full disk kills the job while restoring the Gradle cache
      # ("No space left on device") or truncates the NDK download ("Error
      # reading Zip content"). Remove preinstalled toolchains the build never
      # uses before anything is restored.
      - name: Free disk space
        if: matrix.platform == 'android'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/julia* \
            /opt/az /opt/microsoft /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Select Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Gradle cache is the only build cache here. `eas build --local`
      # builds in a temporary copy of the repository, so nothing it produces
      # lands in the checkout: the caches this job once had for
      # ~/.eas-build-local and apps/mobile/ios/Pods pointed at folders that
      # never existed, missed on every run and saved nothing.
      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'apps/mobile/patches/**') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      # After `npm ci`: the action exports EXPO_TOKEN (build and submit to both
      # stores) to every later step, so dependency install scripts run without
      # it. Pinned rather than `latest`, so a new eas-cli release cannot reach
      # the token unreviewed; bump it on purpose.
      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 27.5.0
          token: ${{ secrets.EXPO_TOKEN }}

      # The release build runs R8 in the 4 GB Gradle daemon (plus a Kotlin
      # daemon) while CMake compiles the app's native code for four ABIs. On
      # the 16 GB runner that peak exhausts RAM and the VM is shut down mid-
      # Gradle ("The runner has received a shutdown signal"), so grow the
      # image's 4 GB swap file and log peak memory for the next diagnosis.
      - name: Add swap space
        if: matrix.platform == 'android'
        run: |
          swapfile=/mnt/swapfile
          [ -d /mnt ] || swapfile=/swapfile
          sudo swapoff -a
          sudo rm -f "$swapfile"
          sudo fallocate -l 16G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile" > /dev/null
          sudo swapon "$swapfile"
          free -h
          # Runs until the job ends; the runner reaps it with the other orphans.
          (while sleep 15; do free -m | awk '/^Mem:/ {m = $3} /^Swap:/ {print m, $3}'; done) > "$RUNNER_TEMP/memory.log" 2>&1 &

      - name: Resolve output path
        id: output
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            ext=ipa
          elif [ "${{ matrix.profile }}" = "production" ]; then
            ext=aab
          else
            ext=apk
          fi
          echo "file=./build/money2time-${{ matrix.platform }}-${{ matrix.profile }}.$ext" >> "$GITHUB_OUTPUT"

      - name: Build app
        working-directory: apps/mobile
        run: |
          mkdir -p build
          eas build \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --local \
            --non-interactive \
            --output=${{ steps.output.outputs.file }}

      - name: Report peak memory and disk
        if: always() && matrix.platform == 'android'
        run: |
          df -h /
          [ -s "$RUNNER_TEMP/memory.log" ] || exit 0
          awk '{if ($1 > m) m = $1; if ($2 > s) s = $2} END {print "Peak RAM used: " m " MB, peak swap used: " s " MB"}' "$RUNNER_TEMP/memory.log"

      - name: Submit build
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --path ${{ steps.output.outputs.file }} \
            --non-interactive

  dev-build:
    name: Dev · Build (${{ github.event.inputs.platform }})
    needs: [checks, lint]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        uses: ./.github/actions/node-deps
        with:
          directory: apps/mobile
          node-version: 22

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 27.5.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start cloud dev-client build
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform }} \
            --profile development \
            --non-interactive \
            --no-wait
