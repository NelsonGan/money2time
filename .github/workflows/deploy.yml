name: CI / CD

# Give each run a clear title in the Actions list so production, PR-preview,
# manual, and branch runs are easy to tell apart at a glance.
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR Preview · #{0}', github.event.number)
   || github.event_name == 'workflow_dispatch' && format('Manual · {0}/{1}', github.event.inputs.platform, github.event.inputs.profile)
   || github.ref == 'refs/heads/main' && 'Production Release'
   || format('Branch · {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
      profile:
        description: EAS profile
        type: choice
        default: production
        options:
          - production
          - preview
          - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test

  preview-pending:
    name: PR Preview · Pending comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Flag preview comment as pending
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- eas-update-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            // Keep the previously published QR/link in place and only flip the
            // status row, so the user can still scan the old build meanwhile but
            // knows it isn't the latest commit yet.
            const pendingStatus = `| **Status** | ⏳ Building \`${commit}\`… — the QR below is still the previous build |`;
            const statusRe = /\| \*\*Status\*\* \|[^\n]*\|/;
            if (existing && statusRe.test(existing.body)) {
              const body = existing.body.replace(statusRe, pendingStatus);
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              // No preview published yet — post a lightweight placeholder.
              const body = [
                marker,
                '## 📱 Preview this update',
                '',
                `⏳ **Building the first preview** for commit \`${commit}\`… This comment updates automatically with a QR code and link the moment it is ready.`,
              ].join('\n');
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

  worker-preview:
    name: PR Preview · Worker
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # App-only PRs skip the upload and fall back to the production Worker, so
      # their EAS preview still scans against a live backend.
      url: ${{ steps.worker.outputs.url || 'https://workers-receipt-scanner.money2time.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Depth 2 so the PR merge commit's base parent is available for the
          # changed-paths check below.
          fetch-depth: 2

      # Only PRs that touch the Worker need a preview upload. Skipping the rest
      # keeps app-only and fork PRs (whose runs don't get the Cloudflare
      # secrets) from failing the EAS preview that depends on this job.
      - name: Detect Worker changes
        id: changes
        run: |
          # PR runs check out the merge commit; parent 1 is the base branch, so
          # this diff is exactly the PR's changes.
          if git diff --name-only HEAD^1 HEAD | grep -qE '^cloudflare/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # wrangler v4 requires Node >= 22 (the rest of the app CI stays on 20).
      - name: Set up Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy branch Worker (preview)
        if: steps.changes.outputs.changed == 'true'
        id: worker
        working-directory: cloudflare/workers/receipt-scanner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run typecheck
          # Upload a preview version of this branch's Worker under a stable
          # per-PR alias, so the URL is predictable across commits. `versions
          # upload` publishes at 0% traffic — it never affects the production
          # Worker on workers-receipt-scanner.money2time.com. Preview versions
          # keep the bindings from wrangler.toml, so they share the production
          # D1 (throwaway rate-limit/cache rows — acceptable).
          alias="pr-${{ github.event.number }}"
          set -o pipefail
          out=$(npx wrangler versions upload --preview-alias "$alias" --tsconfig tsconfig.json 2>&1 | tee /dev/stderr)
          url=$(printf '%s\n' "$out" | grep -oE "https://${alias}-[a-z0-9.-]+\.workers\.dev" | head -n1)
          if [ -z "$url" ]; then
            echo "::error::Could not parse the aliased Worker preview URL from wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  pr-update:
    name: PR Preview · EAS Update
    needs: [test, worker-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build update message
        id: message
        env:
          # Read the title through an env var (never inline it into the script)
          # so an arbitrary title can't inject shell commands.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The EAS update message is cosmetic. Strip double quotes and
          # backticks so a title like Add "X" step doesn't break the preview
          # action's argv parsing (it splits the command string on quotes).
          clean="${PR_TITLE//\"/}"
          clean="${clean//\`/}"
          echo "text=${clean}" >> "$GITHUB_OUTPUT"

      - name: Publish PR update
        id: preview
        uses: expo/expo-github-action/preview@v8
        env:
          # Point this branch's JS bundle at the branch's Worker preview so the
          # PR build talks to its own Worker. main leaves this unset and pulls
          # the fixed production URL from the Expo cloud env var instead.
          EXPO_PUBLIC_MONEY2TIME_WORKERS_RECEIPT_SCANNER: ${{ needs.worker-preview.outputs.url }}
        with:
          command: eas update --branch pr-${{ github.event.number }} --message "${{ steps.message.outputs.text }}"
          comment: false

      - name: Comment QR code and link
        uses: actions/github-script@v7
        with:
          script: |
            const link = `${{ steps.preview.outputs.link }}`;
            const qr = `${{ steps.preview.outputs.qr }}`;
            const branch = `${{ steps.preview.outputs.branchName }}`;
            const runtime = `${{ steps.preview.outputs.runtimeVersion }}`;
            const workerUrl = `${{ needs.worker-preview.outputs.url }}`;
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            // This step runs right after the update is published, so "now" is
            // effectively when the EAS update finished.
            const publishedAt = new Date().toLocaleString('en-US', {
              timeZone: 'Asia/Singapore',
              dateStyle: 'medium',
              timeStyle: 'short',
            }) + ' GMT+8';
            const marker = '<!-- eas-update-preview -->';
            const body = [
              marker,
              '## 📱 Preview this update',
              '',
              'Your changes are published to a preview branch — open them on your device in one tap.',
              '',
              '<table>',
              '<tr>',
              `<td width="260" align="center"><a href="${link}"><img src="${qr}" width="220" alt="EAS Update QR code" /></a><br/><sub>Scan or tap to open with your dev build</sub></td>`,
              '<td valign="middle">',
              '',
              '| | |',
              '| --- | --- |',
              '| **Status** | ✅ Up to date |',
              `| **Branch** | \`${branch}\` |`,
              `| **Runtime** | \`${runtime}\` |`,
              `| **Worker** | ${workerUrl ? `[Open ↗](${workerUrl})` : '—'} |`,
              `| **Commit** | \`${commit}\` |`,
              `| **Published** | ${publishedAt} |`,
              '',
              '</td>',
              '</tr>',
              '</table>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Production Worker deploys live in the dedicated cloudflare.yml workflow (runs on
  # push to main when cloudflare/** changes), so there is no worker-deploy job here —
  # that would double-deploy the Worker on every push to main.

  plan:
    name: Production · Plan
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'development')
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Resolve build matrix
        id: matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'include=[{"platform":"ios","label":"iOS","os":"macos-15","profile":"production"},{"platform":"android","label":"Android","os":"ubuntu-latest","profile":"production"}]' >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.platform }}" = "ios" ]; then
              os="macos-15"
              label="iOS"
            else
              os="ubuntu-latest"
              label="Android"
            fi
            echo "include=[{\"platform\":\"${{ inputs.platform }}\",\"label\":\"$label\",\"os\":\"$os\",\"profile\":\"${{ inputs.profile }}\"}]" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Production · App (${{ matrix.label }} · ${{ matrix.profile }})
    needs: plan
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'development')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Verify branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploy can only run on main (got ${{ github.ref }})."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache eas-build-local
        uses: actions/cache@v4
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-eas-build-local-

      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Resolve output path
        id: output
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            ext=ipa
          elif [ "${{ matrix.profile }}" = "production" ]; then
            ext=aab
          else
            ext=apk
          fi
          echo "file=./build/money2time-${{ matrix.platform }}-${{ matrix.profile }}.$ext" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          mkdir -p build
          eas build \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --local \
            --non-interactive \
            --output=${{ steps.output.outputs.file }}

      - name: Submit build
        run: |
          eas submit \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --path ${{ steps.output.outputs.file }} \
            --non-interactive

  dev-build:
    name: Dev · Build (${{ github.event.inputs.platform }})
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start cloud dev-client build
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform }} \
            --profile development \
            --non-interactive \
            --no-wait
