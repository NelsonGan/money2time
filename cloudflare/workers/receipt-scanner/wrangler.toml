name = "money2time-workers-receipt-scanner"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Custom domain — the money2time.com zone must be on this Cloudflare account.
# `wrangler deploy` provisions the cert + route for this hostname automatically.
routes = [
  { pattern = "workers-receipt-scanner.money2time.com", custom_domain = true }
]

# Production is reached only through the custom domain above, so we don't expose a
# public *.workers.dev route (workers_dev = false). But keep versioned Preview URLs
# on: the PR branch-preview CI runs `wrangler versions upload --preview-alias pr-<n>`
# and needs a resolvable pr-<n>-money2time-workers-receipt-scanner.<subdomain>.workers.dev
# URL to hand to the app's EAS build via EXPO_PUBLIC_MONEY2TIME_WORKERS_RECEIPT_SCANNER.
# Without these two lines both default to disabled, which silently breaks branch previews.
workers_dev = false
preview_urls = true

# D1 database for the entitlement cache + rate-limit counters
# (schema: cloudflare/d1/receipt-scanner/schema.sql).
[[d1_databases]]
binding = "MONEY2TIME_D1_RECEIPT_SCANNER"
database_name = "money2time-d1-receipt-scanner"
database_id = "1409fa69-bbe8-4251-94b0-c96f653849e8"

# Daily cron that prunes expired D1 rows (scan_usage / entitlement_cache). D1
# has no native TTL, so the scheduled() handler runs the cleanup.
[triggers]
crons = ["0 3 * * *"]

# Workers Logs. Declared here so EVERY version wrangler creates gets it — both
# `wrangler deploy` (production) and `wrangler versions upload` (branch preview)
# — otherwise preview versions log nothing while production still does.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
MODEL = "nex-agi/nex-n2-mini"
ENTITLEMENT_ID = "pro"
# Per-tier scan cap + metering cadence. INTERVAL is day | week | month | year
# with an optional count prefix ("100year" ≈ lifetime); change it to re-meter a
# tier without any code/schema change. Free is a lifetime allowance; the Pro
# monthly cap is fair-use only — the app's paywall advertises Pro as unlimited.
FREE_LIMIT = "20"
FREE_INTERVAL = "100year"
PRO_LIMIT = "500"
PRO_INTERVAL = "month"
# Optional image-resolution hint sent to the provider (OpenAI-style
# image_url.detail): "low" | "high" | "auto". "low" downsamples the image to
# cut input tokens, at some OCR-accuracy risk — flip it on here to A/B the
# token cost, remove the line to restore the provider default. Left unset.
# IMAGE_DETAIL = "low"

# Secrets — add in the Cloudflare dashboard (Workers & Pages → this Worker →
# Settings → Variables and Secrets → add as "Secret"), never commit. Dashboard
# secrets persist across `wrangler deploy` (it only reconciles the [vars] above):
#   OPENROUTER_API_KEY             — OpenRouter API key
#   REVENUECAT_SECRET_KEY          — RevenueCat v1 secret API key
#   MONEY2TIME_REQUEST_SIGNING_KEY — shared secret the app signs requests with
#                                    (same value as EXPO_PUBLIC_REQUEST_SIGNING_KEY)
