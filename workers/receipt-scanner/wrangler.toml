name = "money2time-workers-receipt-scanner"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Custom domain — the money2time.com zone must be on this Cloudflare account.
# `wrangler deploy` provisions the cert + route for this hostname automatically.
routes = [
  { pattern = "workers-receipt-scanner.money2time.com", custom_domain = true }
]

# Production is reached only through the custom domain above, so we don't expose a
# public *.workers.dev route (workers_dev = false). But keep versioned Preview URLs
# on: the PR branch-preview CI runs `wrangler versions upload --preview-alias pr-<n>`
# and needs a resolvable pr-<n>-money2time-workers-receipt-scanner.<subdomain>.workers.dev
# URL to hand to the app's EAS build via EXPO_PUBLIC_MONEY2TIME_WORKERS_RECEIPT_SCANNER.
# Without these two lines both default to disabled, which silently breaks branch previews.
workers_dev = false
preview_urls = true

# Storage backend for entitlement cache + rate-limit counters. Switch with the
# STORAGE_BACKEND var below: "kv" (default) uses the KV namespace here; "d1"
# uses the D1 database. Only the selected backend needs to exist.

# KV namespace (active default). Namespace: money2time-workers-kv-receipt-scanner
[[kv_namespaces]]
binding = "MONEY2TIME_WORKERS_KV_RECEIPT_SCANNER"
id = "04a04c4ec7a1440b9f7759556eca5b9d"

# D1 database (uncomment to use STORAGE_BACKEND = "d1"): run
# `wrangler d1 create money2time-workers-receipt-scanner`, paste the printed
# database_id, then apply schema.sql (see README).
# [[d1_databases]]
# binding = "DB"
# database_name = "money2time-workers-receipt-scanner"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Daily cron that prunes expired D1 rows (scan_usage / entitlement_cache). D1 has
# no native TTL, so the scheduled() handler runs the cleanup; it's a no-op while
# STORAGE_BACKEND = "kv" (KV self-expires).
[triggers]
crons = ["0 3 * * *"]

# Workers Logs. Declared here so EVERY version wrangler creates gets it — both
# `wrangler deploy` (production) and `wrangler versions upload` (branch preview)
# — otherwise preview versions log nothing while production still does.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
MODEL = "Qwen/Qwen3-VL-8B-Instruct"
ENTITLEMENT_ID = "pro"
FREE_MONTHLY_LIMIT = "10"
PRO_DAILY_LIMIT = "50"
# Storage backend: "kv" (default) or "d1". See the bindings above.
STORAGE_BACKEND = "kv"

# Secrets (set via `wrangler secret put <NAME>`, never commit):
#   FEATHERLESS_API_KEY        — Featherless API key
#   REVENUECAT_SECRET_KEY  — RevenueCat v1 secret API key
